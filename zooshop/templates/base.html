{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}Зоомагазин{% endblock %}</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="bg-dark text-white p-3 mb-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <h1 class="mb-0">
                <a href="{% url 'goods:home' %}" class="text-white text-decoration-none">Зоомагазин</a>
            </h1>
            <div>
                {% if user.is_authenticated %}
                    <span>Привет, {{user.username}}</span>
                    <form action="{% url 'logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <a href="{% url 'users:profile' %}" class="text-white text-decoration-none me-3 ms-2">Мой профиль</a>
                        <button type="submit" class="btn btn-link text-white text-decoration-none p-0 ms-2">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-white text-decoration-none me-2">Войти</a>
                    <a href="{% url 'users:register' %}" class="text-white text-decoration-none">Регистрация</a>
                {% endif%}
            </div>
        </div>
    </div>
</header>
    <main class="flex-grow-1">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer class="bg-dark text-white text-center p-3 mt-auto">&copy;2026. Все права защищены.</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
